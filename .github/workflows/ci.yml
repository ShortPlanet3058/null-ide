# Builds, lints and tests Null on the three platforms it runs on, for a pull request once
# it's ready (a draft is checked on the Mac: scripts/check.sh), and when started by hand.
# Not again on the merge: the pull request's run was on the merged result already. Changes
# to the site, the docs or the trailer alone build nothing.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "scripts/trailer/**"
      - "scripts/build-site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# (A draft's run, which builds nothing, has a group of its own: pushed as the pull request
# is marked ready, it would cancel the ready one's.)
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft || false }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Small runner disks: no incremental caches.
  CARGO_INCREMENTAL: 0

jobs:
  format:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # What gpui and the rest look for on Linux: fonts, keyboard, X11 and Wayland,
      # Vulkan, sound, devices, D-Bus (the system keyring).
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libwayland-dev libvulkan-dev \
            libasound2-dev libudev-dev libdbus-1-dev libssl-dev zlib1g-dev
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
