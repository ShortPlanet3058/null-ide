# Null's site (site/, with the README's pictures and the app's icon), published on GitHub
# Pages whenever main changes it.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "packaging/null.svg", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the site together
        run: |
          mkdir -p _site/images
          cp -R site/. _site/
          cp docs/images/*.png _site/images/
          cp packaging/null.svg _site/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
