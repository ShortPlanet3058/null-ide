# A version tag (v0.1.0) builds Null for the three platforms and makes a draft GitHub
# release of them, its notes from CHANGELOG.md, to look over before publishing. Started by
# hand on a branch, it builds the platform asked for (no release), to try before merging:
#   gh workflow run release.yml --ref feature/x -f platform=windows
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which package to build
        type: choice
        options: [windows, linux, macos, all]
        default: windows

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    if: startsWith(github.ref, 'refs/tags/') || inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$GITHUB_REF_NAME"
      # Intel and Apple silicon in one app, in a disk image.
      - run: packaging/macos/bundle.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/Null-*.dmg

  windows:
    if: startsWith(github.ref, 'refs/tags/') || inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The installer's builder (it's on some of GitHub's Windows images, not all).
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: powershell -File packaging\windows\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/null-*.zip
            target/release/null-*-setup.exe

  linux:
    if: startsWith(github.ref, 'refs/tags/') || inputs.platform == 'linux' || inputs.platform == 'all'
    # The oldest Ubuntu GitHub still has: a binary needs the C library it was built
    # against or newer (one built on the latest didn't start on 24.04).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libwayland-dev libvulkan-dev \
            libasound2-dev libudev-dev libdbus-1-dev libssl-dev zlib1g-dev
      - run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/null-*.tar.gz
            target/release/null-*.deb

  release:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # This version's part of the changelog: from its heading to the next.
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 ~ "^## " { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          test -s notes.md
      # Each package once, under a name without the version: the site's links always get
      # the latest (releases/latest/download/null-windows-x86_64.zip).
      - name: Names that stay
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv "dist/Null-$version.dmg" dist/Null-macos.dmg
          mv "dist/null-$version-windows-x86_64.zip" dist/null-windows-x86_64.zip
          mv "dist/null-$version-windows-x86_64-setup.exe" dist/null-windows-x86_64-setup.exe
          mv "dist/null-$version-linux-x86_64.tar.gz" dist/null-linux-x86_64.tar.gz
          mv "dist/null-$version-amd64.deb" dist/null-linux-amd64.deb
      # What Null's Update reads: the version and each package's SHA-256, signed with the
      # release key (its public half is in src/updates.rs). No key, no release.
      - name: Signed update details
        env:
          NULL_UPDATE_KEY: ${{ secrets.NULL_UPDATE_KEY }}
        run: |
          test -n "$NULL_UPDATE_KEY" || { echo "The NULL_UPDATE_KEY secret is missing"; exit 1; }
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import hashlib, json, os, sys
          files = {f: hashlib.sha256(open(f"dist/{f}", "rb").read()).hexdigest() for f in sorted(os.listdir("dist"))}
          json.dump({"version": sys.argv[1], "files": files}, open("dist/update.json", "w"), separators=(",", ":"))
          PY
          umask 077
          printf '%s\n' "$NULL_UPDATE_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/update.json -out dist/update.json.sig
          rm "$RUNNER_TEMP/key.pem"
          cat dist/update.json
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Null ${GITHUB_REF_NAME#v}" --notes-file notes.md
