# A version tag (v0.1.0) builds Null for the three platforms and makes a draft GitHub
# release of them, its notes from CHANGELOG.md, to look over before publishing. A pull
# request labelled `package` builds them too, without a release: they're on its run's
# page, to try before merging.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.pull_request.labels.*.name, 'package')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$GITHUB_REF_NAME"
      # Intel and Apple silicon in one app, in a disk image.
      - run: packaging/macos/bundle.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/Null-*.dmg

  windows:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.pull_request.labels.*.name, 'package')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The installer's builder (it's on some of GitHub's Windows images, not all).
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: powershell -File packaging\windows\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/null-*.zip
            target/release/null-*-setup.exe

  linux:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.pull_request.labels.*.name, 'package')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libwayland-dev libvulkan-dev \
            libasound2-dev libudev-dev libdbus-1-dev libssl-dev zlib1g-dev
      - run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/release/null-*.tar.gz
            target/release/null-*.deb

  release:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # This version's part of the changelog: from its heading to the next.
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 ~ "^## " { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          test -s notes.md
      # Also under names without the version: the site's links always get the latest
      # (releases/latest/download/null-windows-x86_64.zip).
      - name: Names that stay
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "dist/Null-$version.dmg" dist/Null-macos.dmg
          cp "dist/null-$version-windows-x86_64.zip" dist/null-windows-x86_64.zip
          cp "dist/null-$version-windows-x86_64-setup.exe" dist/null-windows-x86_64-setup.exe
          cp "dist/null-$version-linux-x86_64.tar.gz" dist/null-linux-x86_64.tar.gz
          cp "dist/null-$version-amd64.deb" dist/null-linux-amd64.deb
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Null ${GITHUB_REF_NAME#v}" --notes-file notes.md
