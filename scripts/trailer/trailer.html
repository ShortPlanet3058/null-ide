<!doctype html>
<!--
  Null's trailer. Every frame is drawn by render(t) from the time alone, so render.sh can
  record it frame by frame (opening this file in a browser plays it, silent: Space pauses,
  ← → step, ?t=24 opens it at a moment, a click on the bar seeks).

  It's cut on its music, "Two AM Window" (music.mp3), 120 BPM: a bar is 2 s, B(k) is bar k.
  render.sh takes bars 8 to 11 out of the track's opening groove, so the music here runs:
    bars 0–11   the groove           the noise (0–3), Null (4–5), six things it does (6–11)
    bars 12–13  silence              "And AI? Only when you ask."
    bars 14–17  the breakdown        AI, in the code
    bars 18–24  the drop             themes, keys, macOS · Windows · Linux, everything at once
    bar 25      the last hit         the name, null-ide.com
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Null trailer</title>
<style>
@font-face { font-family: "Instrument Sans"; font-weight: 400; src: url("../../assets/fonts/instrument-sans/InstrumentSans-Regular.ttf"); }
@font-face { font-family: "Instrument Sans"; font-weight: 500; src: url("../../assets/fonts/instrument-sans/InstrumentSans-Medium.ttf"); }
@font-face { font-family: "Instrument Sans"; font-weight: 600; src: url("../../assets/fonts/instrument-sans/InstrumentSans-SemiBold.ttf"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; src: url("../../assets/fonts/instrument-sans/InstrumentSans-Bold.ttf"); }
@font-face { font-family: "Geist Mono"; font-weight: 400; src: url("../../assets/fonts/geist-mono/GeistMono-Regular.ttf"); }
@font-face { font-family: "Geist Mono"; font-weight: 500; src: url("../../assets/fonts/geist-mono/GeistMono-Medium.ttf"); }

:root { --ui: "Instrument Sans", -apple-system, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace; --amber: #f2b35b; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; overflow: hidden; }
body.player { display: grid; place-items: center; height: 100vh; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #ebe8e2; font-family: var(--ui); -webkit-font-smoothing: antialiased; transform-origin: center; }
.layer { position: absolute; inset: 0; visibility: hidden; }
.caret { display: inline-block; position: relative; width: 5px; background: var(--amber); border-radius: 2px; box-shadow: 0 0 26px rgba(242,179,91,.6); }
.dot { color: var(--amber); }

/* ---------- the noise ---------- */
#noisebox { position: absolute; inset: 0; transform-origin: 960px 540px; }

#noise .bare { background: none; border: none; overflow: visible; }
#noise .row { display: flex; align-items: center; gap: 18px; height: 100%; padding: 0 14px; white-space: nowrap; }

#noise .col { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 16px; }
#noise .tab { padding: 0 16px; height: 100%; display: flex; align-items: center; border-right: 1px solid #26262d; }
#noise .line { height: 10px; border-radius: 3px; background: #24242a; margin: 10px 14px; }
#noise .head { font: 600 13px/1 var(--ui); letter-spacing: .08em; color: #8b8a92; padding: 14px; }

#noise .toast b { display: block; color: #ebe8e2; font-weight: 600; margin-bottom: 6px; }

#noise .ai b { color: #e7defd; }
#noise .ghost { font: italic 400 16px/1 var(--mono); color: #6c6680; white-space: nowrap; }

#name .caret { width: 10px; height: 180px; border-radius: 5px; }

/* ---------- titles, keys ---------- */
#scrim { position: absolute; left: 0; top: 0; bottom: 0; width: 1000px; background: linear-gradient(90deg, #000 0, #000 62%, rgba(0,0,0,0)); }

/* ---------- the window ---------- */
#window { position: absolute; left: 0; top: 0; width: 1520px; height: 840px; border-radius: 14px; overflow: hidden; background: var(--bg); color: var(--fg); box-shadow: 0 40px 140px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.09); transform-origin: 0 0; }
.titlebar { position: absolute; left: 0; right: 0; top: 0; height: 50px; border-bottom: 1px solid var(--line); background: var(--bg); }

.tabs { position: absolute; left: 104px; top: 8px; display: flex; gap: 6px; }

.ftab.on { background: var(--raised); color: var(--fg); }

.status .aidot { width: 7px; height: 7px; border-radius: 50%; background: var(--caret); box-shadow: 0 0 10px var(--caret); }

.r.cur .n { color: var(--fg); }
.r.cur { background: rgba(255,255,255,.025); }
.r.del { background: var(--del); }
.r.del .t span { color: var(--faint) !important; }
.r.del .t .struck { text-decoration: line-through; text-decoration-color: var(--faint); }
.r.add { background: var(--add); }
.r.add::before { content: ""; position: absolute; left: 76px; top: 0; bottom: 0; width: 3px; background: var(--modified); }
.hint { position: absolute; left: 100px; display: flex; gap: 8px; align-items: center; font: 400 15px/1 var(--ui); color: var(--muted); }
.hint .k { border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 7px; font-size: 13px; color: var(--fg); margin-left: 10px; }
.hint .k:first-child { margin-left: 0; }
.prompt { position: absolute; left: 100px; width: 780px; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 9px; background: var(--raised); border: 1px solid var(--caret-half); font: 400 18px/1 var(--ui); }
.prompt .star { color: var(--caret); }
.prompt .grow { flex: 1; color: var(--fg); }
.prompt .ph { color: var(--faint); }
.prompt .hintr { color: var(--muted); font-size: 15px; }
.k-kw { color: var(--kw); } .k-ty { color: var(--ty); } .k-fn { color: var(--fn); } .k-st { color: var(--st); }
.k-nu { color: var(--nu); } .k-co { color: var(--co); } .k-pu { color: var(--pu); } .k-at { color: var(--at); } .k-ma { color: var(--fn); }
.codecaret { position: absolute; width: 2px; height: 25px; background: var(--caret); }
.term { position: absolute; left: 351px; right: 0; bottom: 37px; border-top: 1px solid var(--line); background: var(--bg); overflow: hidden; }
.term .h { position: absolute; left: 20px; top: 14px; font-size: 16px; display: flex; gap: 10px; }
.term .h span:last-child { color: var(--muted); }
.term .out { position: absolute; left: 18px; right: 18px; font: 400 17px/27px var(--mono); white-space: pre; }
.g { color: #86d6a2; } .red { color: #e88d8d; } .b { font-weight: 500; }
.tcaret { display: inline-block; width: 10px; height: 20px; background: var(--caret); vertical-align: -4px; }
.palette { position: absolute; left: 330px; width: 860px; top: 70px; border-radius: 16px; background: var(--raised); border: 1px solid var(--line-2); box-shadow: 0 30px 90px rgba(0,0,0,.55); overflow: hidden; }
.palette .q { height: 72px; display: flex; align-items: center; padding: 0 30px; font: 400 25px/1 var(--ui); border-bottom: 1px solid var(--line); position: relative; }
.palette .q .ph { color: var(--faint); }
.palette .q .r2 { position: absolute; right: 30px; font-size: 17px; color: var(--muted); }
.palette .item { height: 54px; margin: 6px 9px; padding: 0 22px; display: flex; align-items: center; gap: 14px; border-radius: 10px; font-size: 19px; }
.palette .item.on { background: var(--sel-row); }
.palette .m { color: var(--caret); }
.palette .w { margin-left: auto; color: var(--muted); font-size: 16px; }
.notice { position: absolute; right: 24px; bottom: 54px; padding: 12px 18px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-2); font-size: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }

/* ---------- pictures of the app ---------- */
.shot { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 40px 140px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.09); background: #000; }
.shot canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

/* ---------- AI's providers ---------- */

/* ---------- themes, keys ---------- */

#keymaps .km { font: 700 120px/1 var(--ui); letter-spacing: -0.04em; color: #2a2a31; }
#keymaps .km.on { color: #fff; }
#keymaps .lead { font: 400 40px/1.2 var(--ui); color: #9a99a1; margin-top: 18px; }

/* ---------- everywhere ---------- */
.os { position: absolute; inset: 0; visibility: hidden; }
.os .logo { position: absolute; left: 160px; top: 290px; width: 300px; height: 300px; display: grid; place-items: center; }
.os .logo svg { width: 100%; height: 100%; overflow: visible; }
.os .osname { position: absolute; left: 120px; top: 640px; width: 640px; text-align: center; font: 700 120px/1 var(--ui); letter-spacing: -0.04em; }
.os .ossub { position: absolute; left: 120px; top: 790px; width: 640px; text-align: center; font: 400 34px/1.25 var(--ui); color: #9a99a1; }
.os .frame { position: absolute; left: 820px; top: 180px; width: 1520px; height: 840px; transform-origin: 0 0; }

/* ---------- everything at once ---------- */
#tiles .tile { position: absolute; width: 560px; height: 310px; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.1); background: #000; }
#tiles .tile > div { position: absolute; left: 0; top: 0; width: 1520px; height: 840px; transform: scale(0.3684); transform-origin: 0 0; }

/* ---------- the end ---------- */
#endmark { position: absolute; left: 0; right: 0; top: 310px; display: flex; justify-content: center; align-items: center; gap: 34px; font: 600 210px/1 var(--ui); letter-spacing: -0.035em; }
#endmark .caret { width: 11px; height: 190px; border-radius: 5px; }
#tagline { position: absolute; left: 0; right: 0; top: 580px; text-align: center; font: 400 50px/1.2 var(--ui); color: #b9b7bf; }

#cta span { padding: 16px 34px; border-radius: 16px; background: var(--amber); color: #1b1206; font: 600 36px/1 var(--ui); }
#facts { position: absolute; left: 0; right: 0; top: 806px; text-align: center; font: 500 28px/1.2 var(--ui); color: #6f6e76; }

#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: #111; cursor: pointer; }

<body>
<div id="stage">
  <div class="layer" id="noise"><div id="noisebox"></div><div id="shout"><span id="shouttext"></span></div></div>
  <div class="layer" id="intro"><div id="name"><span class="caret" id="namecaret"></span><span id="nametext"></span></div><div id="namesub">A calm, fast code editor.</div></div>
  <div class="layer" id="story"><div id="window"></div></div>
  <div class="layer" id="md"><div class="shot" id="mdshot"><canvas data-src="shots/md.jpg"></canvas></div></div>
  <div class="layer" id="quiet"><span id="q1"></span><br><span class="second" id="q2"></span><span class="caret" id="qcaret"></span></div>
  <div class="layer" id="keymapsl"><div id="keymaps"></div></div>
  <div class="layer" id="everywhere"></div>
  <div class="layer" id="tiles"></div>
  <div class="layer" id="words"><div id="scrim"></div><div id="title"><div id="tword"></div><div id="tsub"></div></div><div id="keys"></div><div id="chips"></div></div>
  <div class="layer" id="end">
    <div id="endmark"><span class="caret"></span><span>Null</span></div>
    <div id="tagline">A calm, fast code editor.</div>
    <div id="cta"><span>null-ide.com</span></div>
    <div id="facts">Free to use&nbsp;&nbsp;·&nbsp;&nbsp;macOS&nbsp;&nbsp;·&nbsp;&nbsp;Windows&nbsp;&nbsp;·&nbsp;&nbsp;Linux</div>
  </div>
</div>
<script>
"use strict";
const QUERY = new URLSearchParams(location.search);

// ---------- the music's clock ----------
const BEAT = 0.4995, BAR = 4 * BEAT;
const B = k => 0.07 + BAR * k;          // bar k (the first beat is 70 ms in)
window.DURATION = 54.5;                 // the last hit at B(25), then the card stays

// ---------- clips for the website: ?clip=name, a stretch of the trailer without its words,
// slowed, with a steady camera of its own: [from, to, speed, [zoom, x, y, zoom at the end, x, y]]
// (the trailer's camera leaves room for its words) ----------
const CLIPS = {
  hero: [B(6) + 0.8, B(11), 0.55, [1.1, 760, 420, 1.18, 770, 430]],
  calm: [B(6) + 0.75, B(7), 0.55, [1.12, 760, 420, 1.2, 780, 430]],
  fast: [B(7), B(8), 0.55, [1.2, 760, 400, 1.27, 770, 390]],
  precise: [B(8), B(9), 0.55, [1.42, 680, 380, 1.52, 670, 370]],
  run: [B(9), B(10), 0.55, [1.2, 760, 440, 1.28, 760, 470]],
  commit: [B(10), B(11), 0.55, [1.25, 680, 420, 1.33, 660, 420]],
  write: [B(11), B(12) - 0.3, 0.55],
  ai: [B(14), B(18), 0.85, [1.22, 760, 420, 1.3, 760, 430]],
  themes: [B(18), B(18) + 6 * BEAT, 0.45, [1.17, 760, 420, 1.2, 760, 420]],
};
const CLIP = CLIPS[QUERY.get("clip")] || null;
const BARE = !!CLIP;
if (CLIP) window.DURATION = (CLIP[1] - CLIP[0]) / CLIP[2];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const out3 = x => 1 - Math.pow(1 - x, 3);
const out5 = x => 1 - Math.pow(1 - x, 5);
const inOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const in3 = x => x * x * x;
const fade = (t, a, b, c, d) => Math.min(out3(prog(t, a, b)), 1 - in3(prog(t, c, d)));
const blink = (t, since = -1, still = 0.5) => (t - since < still ? 1 : ((t - since - still) % 1.0) < 0.5 ? 1 : 0);
/** A little overshoot as something lands: 0 → 1, past 1, settling. */
const land = x => (x <= 0 ? 0 : x >= 1 ? 1 : 1 + Math.sin(x * Math.PI * 1.2) * (1 - x) * 0.35 - Math.pow(1 - x, 3));
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function show(id, o, transform) {
  const el = typeof id === "string" ? $(id) : id;
  el.style.opacity = o;
  el.style.visibility = o > 0.001 ? "visible" : "hidden";
  if (transform !== undefined) el.style.transform = transform;
  return o > 0.001;
}
function setHTML(id, html) { const el = typeof id === "string" ? $(id) : id; if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; } }

// Sounds the trailer asks for (score.swift makes and mixes them): [time, kind, loudness].

const sound = (t, kind, gain = 1) => window.SOUNDS.push([+t.toFixed(3), kind, gain]);
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
/** Someone typing `text` from `start`: each character its own (repeatable) moment, a key sound each. */
function typing(text, start, perChar, seed = 7, gain = 0.45) {
  const r = seeded(seed), at = [];
  let time = start;
  for (const ch of text) {
    time += perChar * (0.55 + r() * 0.9) + (ch === " " ? perChar * 0.4 : 0) + (ch === "\n" ? perChar * 3 : 0);
    at.push(time);
    if (gain > 0) sound(time, ch === "\n" ? "enter" : "key", gain * (0.75 + r() * 0.5));
  }
  return {
    text, at, start, end: time,
    shown(t) { let n = 0; while (n < at.length && at[n] <= t) n++; return text.slice(0, n); },
    last(t) { let l = start; for (const a of at) if (a <= t) l = a; return l; },
  };
}

// ---------- Rust colours ----------
const KW = new Set("pub fn let const struct impl match if else self Self use mut as return for in where enum crate mod async await".split(" "));
function colour(src) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(#\[[^\]]*\])|(\b\d[\d_]*\b)|(\b[a-z_][a-z0-9_]*!)|(\b[A-Za-z_][A-Za-z0-9_]*\b)(?=\s*\()|(\b[A-Za-z_][A-Za-z0-9_]*\b)|([^\sA-Za-z0-9_])/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const [w] = m;
    let cls;
    if (m[1]) cls = "co"; else if (m[2]) cls = "st"; else if (m[3]) cls = "at"; else if (m[4]) cls = "nu"; else if (m[5]) cls = "ma";
    else if (m[6]) cls = KW.has(w) ? "kw" : /^[A-Z]/.test(w) ? "ty" : "fn";
    else if (m[7]) cls = KW.has(w) ? "kw" : /^[A-Z]/.test(w) || /^(u8|u32|u64|str|bool)$/.test(w) ? "ty" : null;
    else cls = "pu";
    out += cls ? `<span class="k-${cls}">${esc(w)}</span>` : esc(w);
    last = m.index + w.length;
  }
  return out + esc(src.slice(last));
}

  let y = 10 - s.scroll * lh, caretY = null, caretN = 1;
  const tops = [];
  s.rows.forEach((r, i) => {
    const rh = (r.h === undefined ? 1 : r.h) * lh;

  }
  const st = s.status || {};

    ${st.ai ? `<span class="aidot" style="opacity:${st.ai}"></span>` : ""}<span>${s.carets && s.carets.length ? `${s.carets.length + 1} cursors` : `Ln ${caretN}, Col ${s.caretCol + 1}`}</span><span>Rust</span></div>`;

  return h + (s.overlay || "");

const rowsOf = (lines, start = 1) => lines.map((text, i) => ({ text, n: start + i }));
const baseState = () => ({ tabs: [["cart.rs", true]], active: "cart", bars: 1, rows: [], scroll: 0, caretCol: 4, caretBlink: 1, sidebar: "files", status: { crumbs: "src/cart.rs › Cart" } });

// ---------- the story: one scene a bar ----------
function storyState(t) {
  const s = baseState();
  if (t < B(7)) {
    // Calm: writing a line, the bars fading away while the hands are busy.
    const typed = T.code.shown(t);
    const lines = CART.concat(SUBTOTAL.slice(0, 2), ["        " + typed]);
    s.rows = rowsOf(lines.concat(SUBTOTAL.slice(3), SHIPPING_FN));
    s.rows[lines.length - 1].caret = true;
    s.caretCol = 8 + typed.length;
    s.scroll = 9;
    s.caretBlink = blink(t, T.code.last(t), 0.4);
    s.bars = t < T.code.start ? 1 : 1 - 0.88 * out3(prog(t, T.code.start, T.code.start + 0.45));
    s.status.crumbs = "src/cart.rs › subtotal";
  } else if (t < B(8)) {
    // Fast: ⌘P, "tests", ↵.
    const opened = t > B(7) + 1.35;
    const p = fade(t, B(7) + 0.06, B(7) + 0.2, B(7) + 1.35, B(7) + 1.48);
    s.rows = rowsOf(opened ? TEST : CART_DONE);
    s.scroll = opened ? 0 : 9;
    if (opened) { s.tabs = [["cart.rs", false], ["cart.rs  tests", true]]; s.active = "test"; s.rows[13].caret = true; s.status.crumbs = "tests/cart.rs › free_shipping_above_50"; }
    else s.rows[CART.length + 2].caret = true;
    s.caretBlink = blink(t, B(7) + 1.4, 0.5);
    if (p > 0) {
      const q = T.query.shown(t);
      const hits = q.length >= 2
        ? [["<span class='m'>tests</span>/cart.rs", "tests"], ["src/cart.rs", "src"], ["README.md", ""]]
        : [["cart.rs", "src"], ["lib.rs", "src"], ["price.rs", "src"], ["cart.rs", "tests"], ["README.md", ""]];
      s.overlay = `<div class="palette" style="opacity:${p};transform:translateY(${(1 - p) * -10}px)"><div class="q"><span style="display:inline-block;width:2px;height:28px;background:var(--caret);margin-right:2px;opacity:${blink(t, T.query.last(t), 0.4)}"></span>${q ? esc(q) : '<span class="ph">Go to file, @ for a symbol</span>'}<span class="r2">↵ open</span></div>
        ${hits.map((h, i) => `<div class="item ${i === 0 ? "on" : ""}"><span>${h[0]}</span><span class="w">${h[1]}</span></div>`).join("")}<div style="height:6px"></div></div>`;
    }
  } else if (t < B(9)) {
    // Precise: three fields, three cursors, one edit.
    const typed = T.multi.shown(t);
    const lines = CART_DONE.slice();
    for (const i of [8, 9, 10]) lines[i] = lines[i].replace("pub ", `pub${typed} `);
    s.rows = rowsOf(lines);
    s.scroll = 2;
    s.rows[8].caret = true;
    s.caretCol = 7 + typed.length;
    s.carets = [];
    if (t > B(8) + 0.25) s.carets.push([9, 7 + typed.length]);
    if (t > B(8) + 0.75) s.carets.push([10, 7 + typed.length]);
    s.caretBlink = blink(t, Math.max(T.multi.last(t), B(8) + 0.75), 0.5);
    s.status.crumbs = "src/cart.rs › Item";
  } else if (t < B(10)) {
    // Run: the terminal, the tests, all green.
    s.rows = rowsOf(CART_DONE);
    s.scroll = 12;
    s.rows[SHIP_LINE].caret = true;
    s.caretOn = false;
    const open = out3(prog(t, B(9) + 0.02, B(9) + 0.25));
    const cmd = T.cmd.shown(t), ran = t > T.cmd.end + 0.12;
    const lines = [`shop % ${cmd}${ran ? "" : `<span class="tcaret" style="opacity:${blink(t, T.cmd.last(t), 0.4)}"></span>`}`];
    if (ran) {
      const n = Math.floor(prog(t, T.cmd.end + 0.2, B(10) - 0.3) * RUN.length + 0.0001);
      lines.push(...RUN.slice(0, n));
      if (n >= RUN.length) lines.push(`shop % <span class="tcaret"></span>`);
    }
    s.term = { h: 380 * open, lines };
    s.status.crumbs = "src/cart.rs › shipping";
  } else {
    // Commit: the message drafted, ⌘↵.
    s.rows = rowsOf(CART_FIXED);
    s.scroll = SHIP_LINE - 6;
    s.rows[SHIP_LINE + 1].caret = true;
    s.caretCol = 8;
    s.sidebar = "git";
    const draft = T.draft.shown(t).split("\n");
    const committed = t > B(10) + 1.25;
    s.git = {
      message: committed ? "" : draft[0] ? esc(draft[0]) + (draft[1] !== undefined ? `<br><span style="color:var(--muted);font-size:15px">${esc(draft[1])}</span>` : "") : "",
      drafting: t > B(10) + 0.2 && t < T.draft.end,
      go: t > B(10) + 1.05 && !committed,
      files: committed ? 0 : 1,
      ahead: committed,
    };
    s.status.crumbs = "src/cart.rs › shipping";
    if (committed) s.notice = ["Committed 4e1a9c2: Free shipping above 50 €.", out3(prog(t, B(10) + 1.25, B(10) + 1.45))];
  }
  return s;
}

/** AI, in the code: ⌘I, a sentence, the change shown, ⇥. */
function aiState(t) {
  const s = baseState();
  const thinkFrom = T.ask.end + 0.25, changeAt = B(15) + 1.2, kept = inOut(prog(t, B(17), B(17) + 0.4));
  const open = out3(prog(t, changeAt, changeAt + 0.5));
  const promptO = fade(t, B(14) + 0.1, B(14) + 0.3, changeAt - 0.2, changeAt);
  let n = 1;
  CART_DONE.forEach((text, i) => {
    if (i === SHIP_LINE + 1 && open > 0) {
      s.rows.push({ text, cls: "del", h: open * (1 - kept), alpha: 1 - kept });
      FIXED.forEach((a, j) => s.rows.push({ text: a, cls: kept > 0.5 ? "" : "add", h: open, n: n++, fadeBg: 1 - kept, caret: j === 0 }));
      s.rows.push({ hint: true, h: open * (1 - kept) * 1.3 });
      return;
    }
    s.rows.push({ text, n: n++, caret: i === SHIP_LINE + 1 && open === 0 });
    if (i === SHIP_LINE && promptO > 0) {
      const ask = T.ask.shown(t), thinking = t > thinkFrom;
      const inner = thinking
        ? `<span class="star" style="opacity:${0.45 + 0.55 * Math.abs(Math.sin(t * 5))}">✦</span><span class="grow" style="color:var(--muted)">Thinking…</span>`
        : `<span class="star">✦</span><span class="grow">${ask ? esc(ask) + `<span style="display:inline-block;width:2px;height:20px;background:var(--caret);vertical-align:-4px;margin-left:2px;opacity:${blink(t, T.ask.last(t), 0.4)}"></span>` : '<span class="ph">Describe a change, or ask a question</span>'}</span><span class="hintr">${ask ? "↵ change" : ""}</span>`;
      s.rows.push({ prompt: inner, h: promptO * 1.6, o: promptO });
    }
  });
  s.scroll = SHIP_LINE - 7;
  s.caretCol = 8;
  s.caretOn = promptO < 0.5;
  s.caretBlink = blink(t, changeAt, 0.6);
  s.status.crumbs = "src/cart.rs › shipping";
  s.status.ai = 1;
  s.bars = 1 - 0.85 * fade(t, B(14) + 0.3, B(14) + 0.8, B(17) + 0.3, B(17) + 0.9);
  return s;
}

/** The finished code, still: for themes, other systems, the tiles. */
function stillState(extra = {}) {
  const s = baseState();
  s.rows = rowsOf(CART_FIXED);

  s.rows[SHIP_LINE + 1].caret = true;
  s.caretCol = 8;
  s.status.crumbs = "src/cart.rs › shipping";

}

/** Where the camera looks: [from, zoom, x, y, zoom at the end, x, y] in window coordinates,
 *  each shot cut on its beat and drifting to its end. SX: where on screen that point sits. */
const SHOTS = [
  [B(6), 1.0, 760, 420, 1.45, 800, 600, 960],
  [B(6) + 0.75, 1.45, 800, 600, 1.52, 820, 600, 1320],
  [B(7), 1.06, 760, 330, 1.14, 760, 300, 1400],
  [B(8), 1.75, 560, 360, 1.95, 540, 350, 1250],
  [B(9), 1.38, 615, 610, 1.48, 615, 620, 1400],
  [B(10), 1.36, 300, 300, 1.48, 300, 290, 1300],
  [B(14), 1.45, 620, 360, 1.62, 640, 420, 1250],
  [B(18), 1.0, 700, 420, 1.08, 700, 420, 1330],
];
const SHOT_END = [B(6) + 0.75, B(7), B(8), B(9), B(10), B(11), B(18), B(19.5)];
function camera(t) {
  let i = -1;
  SHOTS.forEach((s, j) => { if (t >= s[0]) i = j; });
  if (i < 0) return [1, 760, 420, 960];
  const [a, z0, x0, y0, z1, x1, y1, sx] = SHOTS[i];
  const p = i === 0 ? out5(prog(t, a, SHOT_END[i])) : prog(t, a, SHOT_END[i]);
  const e = i === 0 ? p : 0.5 - 0.5 * Math.cos(Math.PI * p);
  // The first: from the window whole to its code. The others: a beat's push in.
  const prev = i === 1 ? SHOTS[0] : null;
  const fromSX = prev ? prev[7] : sx;
  const sxNow = i === 1 ? fromSX + (sx - fromSX) * out3(prog(t, a, a + 0.35)) : sx;
  return [z0 + (z1 - z0) * e, x0 + (x1 - x0) * e, y0 + (y1 - y0) * e, sxNow];
}
/** On a cut, the picture lands: a small scale bump, fading in a quarter of a second. */
function bump(t, at) { const p = prog(t, at, at + 0.28); return p <= 0 || p >= 1 ? 1 : 1.035 - 0.035 * out3(p); }

function renderStory(t) {
  const inStory = (t >= B(6) - 0.05 && t < B(11)) || (t >= B(14) && t < B(19.5));
  const enter = out3(prog(t, B(6) - 0.05, B(6) + 0.35));
  if (!show("story", inStory ? (t < B(7) ? enter : 1) : 0)) return;
  const w = $("window");
  let state, theme = "Null";
  if (t < B(11)) state = storyState(t);
  else if (t < B(18)) state = aiState(t);
  else {
    // The themes, one a beat.
    const k = clamp(Math.floor((t - B(18)) / BEAT), 0, THEME_NAMES.length - 1);
    theme = THEME_NAMES[k];
    state = stillState();
  }
  applyTheme(w, theme);
  setHTML(w, windowHTML(state));
  let [zoom, x, y, sx] = camera(t);
  const cutAt = SHOTS.reduce((a, s) => (t >= s[0] ? s[0] : a), 0);
  let lands = t < B(6) + 0.75 ? (0.94 + 0.06 * enter) : bump(t, cutAt);
  if (CLIP && CLIP[3]) {
    const [z0, x0, y0, z1, x1, y1] = CLIP[3], p = inOut(prog(t, CLIP[0], CLIP[1]));
    zoom = z0 + (z1 - z0) * p; x = x0 + (x1 - x0) * p; y = y0 + (y1 - y0) * p; lands = 1;
  }
  const z = zoom * lands * (t >= B(18) ? bump(t, B(18) + Math.floor((t - B(18)) / BEAT) * BEAT) : 1);
  const at = BARE ? 960 : sx;
  w.style.transform = `translate(${at - x * z}px, ${540 - y * z}px) scale(${z})`;
}

// ---------- the noise, the name, the quiet ----------
function renderNoise(t) {
  if (!show("noise", t < STOP + 0.02 ? 1 : 0)) return;
  const shake = in3(prog(t, B(2), STOP - 0.3));
  const box = $("noisebox");
  const push = 1 + 0.12 * prog(t, 0, STOP) + 0.025 * Math.exp(-((t - B(0)) % BEAT) * 10) * prog(t, B(1), B(3));
  box.style.transform = `scale(${push})`;
  NOISE.forEach(([l, tp, w, h, , , from], i) => {
    const appears = NOISE_AT(i);
    const inP = out3(prog(t, appears, appears + 0.16));
    const q = in3(prog(t, STOP - 0.3 + (i % 5) * 0.01, STOP - 0.02));
    const cx = l + w / 2, cy = tp + h / 2, slide = 1 - inP;
    const sx = from === "right" ? 220 * slide : from === "left" ? -220 * slide : 0, sy = from === "up" ? 100 * slide : 8 * slide;
    const jx = Math.sin(t * 37 + i * 1.7) * 6 * shake, jy = Math.cos(t * 41 + i * 2.3) * 4 * shake;
    const el = $("n" + i);
    el.style.opacity = inP * (1 - q);
    el.style.visibility = inP > 0 && q < 1 ? "visible" : "hidden";
    el.style.transform = `translate(${sx + jx + (960 - cx) * q}px, ${sy + jy + (540 - cy) * q}px) scale(${(0.94 + 0.06 * inP) * (1 - 0.98 * q)})`;
  });
  for (const [id, a, b] of COUNTERS) {
    const v = Math.round(a + (b - a) * in3(prog(t, B(1), STOP - 0.3)));
    $(id).textContent = id === "nb3" ? v : v > 999 ? "999+" : v;
  }
  $("spin1").style.transform = `rotate(${t * 540}deg)`;
  // The words, on the beats.
  let word = "", o = 0, sc = 1;
  for (const [a, text] of SHOUTS) {
    if (t >= a && t < a + 2 * BEAT) { word = text; const p = prog(t, a, a + 0.18); o = t > STOP - 0.32 ? 0 : 1; sc = 1.25 - 0.25 * out3(p); }
  }
  setHTML("shouttext", word);
  show("shout", word ? o : 0, `scale(${sc})`);
}

    $("logo" + j).style.transform = `scale(${0.6 + 0.4 * l})`;
    $("logo" + j).style.opacity = clamp(local / 0.12);
    const slide = 1 - out3(prog(local, 0.05, 0.45));
    $("frame" + j).style.transform = `translate(${slide * 500}px, 0) scale(${0.78 + 0.03 * prog(local, 0, BAR)})`;
    $("frame" + j).style.opacity = 1 - slide;
  });
}

// ---------- everything at once ----------
const TILES = [];
function buildTiles() {
  const states = [
    () => storyState(B(6) + 1.5), () => storyState(B(7) + 1.0), () => storyState(B(8) + 1.7),
    () => storyState(B(9) + 1.8), () => aiState(B(16)), () => storyState(B(10) + 0.95),
    () => stillState(), () => stillState(), () => stillState({ chrome: "win" }),
  ];
  const themes = ["Null", "Null", "Midnight", "Null", "Null", "Moss", "Paper", "Dune", "Ash"];
  const order = [4, 0, 8, 2, 6, 1, 7, 3, 5];
  let html = "";
  for (let k = 0; k < 9; k++) {
    const col = k % 3, row = Math.floor(k / 3);
    html += `<div class="tile" id="tile${k}" style="left:${45 + col * 615}px;top:${30 + row * 345}px"><div id="tw${k}"></div></div>`;
    TILES.push({ k, at: B(24) + order.indexOf(k) * (BAR / 9) });
  }
  $("tiles").innerHTML = html;
  for (let k = 0; k < 9; k++) {
    const el = $("tw" + k);
    applyTheme(el, themes[k]);
    el.style.background = "var(--bg)"; el.style.color = "var(--fg)";
    el.innerHTML = windowHTML(states[k]());
  }
  TILES.forEach(({ at }) => sound(at, "swish", 0.35));
}
function renderTiles(t) {
  if (!show("tiles", t >= B(24) - 0.02 && t < B(25) + 0.05 ? 1 : 0)) return;
  const away = in3(prog(t, B(25) - 0.3, B(25)));
  for (const { k, at } of TILES) {
    const p = out3(prog(t, at, at + 0.22));
    show("tile" + k, p * (1 - away), `scale(${(1.25 - 0.25 * p) * (1 - 0.3 * away)})`);
  }
  $("tiles").style.transform = `scale(${1 + 0.03 * prog(t, B(24), B(25))})`;
}

// ---------- the end ----------
function renderEnd(t) {
  const E = B(25);
  if (!show("end", fade(t, E - 0.02, E + 0.02, window.DURATION - 0.6, window.DURATION))) return;
  const l = land(prog(t, E, E + 0.55));
  show("endmark", clamp((t - E) / 0.08), `scale(${0.75 + 0.25 * l})`);
  $("endmark").querySelector(".caret").style.opacity = blink(t, E, 0.9);
  show("tagline", out3(prog(t, E + 0.5, E + 1.0)), `translateY(${(1 - out3(prog(t, E + 0.5, E + 1.0))) * 16}px)`);
  show("cta", out3(prog(t, E + 0.9, E + 1.35)), `scale(${0.94 + 0.06 * out3(prog(t, E + 0.9, E + 1.35))})`);
  show("facts", out3(prog(t, E + 1.2, E + 1.7)));
}

// ---------- words over the picture ----------
function renderWords(t) {
  let title = null;
  for (const tt of TITLES) if (t >= tt[0] && t < tt[1]) title = tt;
  let o = 0, y = 0, html = "", sub = "";
  if (title) {
    const [a, b, word, s] = title;
    o = Math.min(out3(prog(t, a, a + 0.18)), 1 - in3(prog(t, b - 0.14, b)));
    y = (1 - out3(prog(t, a, a + 0.3))) * 40;
    html = word === "AI" || word === "Six themes" ? `${word}<span class="dot">.</span>` : `${word}<span class="dot">.</span>`;
    sub = s;
    if (word === "Six themes") {
      const k = clamp(Math.floor((t - B(18)) / BEAT), 0, THEME_NAMES.length - 1);
      sub = `<div id="themenames">${THEME_NAMES.map((n, i) => `<span class="${i === k ? "on" : ""}">${n}</span>`).join("")}</div>`;
    }
  }
  const scrim = o > 0 ? Math.max(o, 0) : 0;
  show("words", Math.max(o, keysShown(t) ? 1 : 0, chipsShown(t) ? 1 : 0));
  show("scrim", scrim);
  setHTML("tword", html);
  setHTML("tsub", sub);
  show("title", o, `translateY(${y}px)`);
  // Keys.
  let kh = "", ko = 0, ks = 1;
  for (const [a, b, keys, alt] of KEYS) {
    const f = fade(t, a, a + 0.08, b - 0.15, b);
    if (f > 0) { kh = `<div class="pill">${keys.map(k => `<span class="key">${k}</span>`).join("")}${alt ? `<span class="key-alt">${alt}</span>` : ""}</div>`; ko = f; ks = 1 - 0.07 * Math.sin(Math.PI * prog(t, a + 0.08, a + 0.24)); }
  }
  setHTML("keys", kh);
  show("keys", ko * (t >= B(14) && t < B(18) ? 0 : 1), `scale(${ks})`);
  // AI's providers, under its title.
  if (show("chips", chipsShown(t))) {
    const list = [["Claude Code", "your plan"], ["Codex", "your plan"], ["Claude API"], ["OpenAI"], ["Gemini"], ["Mistral"], ["Groq"], ["OpenRouter"], ["NVIDIA"], ["Ollama", "on your computer"]];
    setHTML("chips", list.map(([n, w2], i) => `<span style="opacity:${out3(prog(t, B(15) + i * 0.12, B(15) + 0.25 + i * 0.12)).toFixed(2)}">${n}${w2 ? `<i>${w2}</i>` : ""}</span>`).join(""));
  }
}
const keysShown = t => KEYS.some(([a, b]) => t >= a && t < b) && !(t >= B(14) && t < B(18));
const chipsShown = t => fade(t, B(15), B(15) + 0.2, B(18) - 0.15, B(18));

let measured = false;
window.render = function (clipTime) {
  const t = CLIP ? CLIP[0] + clipTime * CLIP[2] : clipTime;
  if (!measured) {
    const c = document.createElement("canvas").getContext("2d");
    c.font = "400 18px 'Geist Mono'";
    charW = c.measureText("0000000000").width / 10;
    measured = true;
  }
  renderNoise(t);
  renderIntro(t);
  renderStory(t);
  renderMd(t);
  renderQuiet(t);
  renderKeymaps(t);
  renderEverywhere(t);
  renderTiles(t);
  renderEnd(t);
  if (BARE) show("words", 0); else renderWords(t);
};

buildNoise();
applyTheme($("window"));
buildEverywhere();
buildTiles();
window.ready = Promise.all([...document.querySelectorAll("canvas[data-src]")].map(canvas => {
  const img = new Image();
  img.src = canvas.dataset.src;
  return img.decode().then(() => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
  }).catch(() => {});
}));
window.SOUNDS.sort((a, b) => a[0] - b[0]);

// ---------- playing it in a browser ----------
if (!navigator.userAgent.includes("NullFilm")) {
  document.body.classList.add("player");
  const bar = document.createElement("div");
  bar.id = "bar"; bar.innerHTML = "<div></div>";
  document.body.appendChild(bar);
  const fit = () => {
    const sc = Math.min(innerWidth / 1920, (innerHeight - 8) / 1080);
    $("stage").style.transform = `scale(${sc})`;
    $("stage").style.margin = `${(1080 * sc - 1080) / 2}px ${(1920 * sc - 1920) / 2}px`;
  };
  addEventListener("resize", fit); fit();
  let t = parseFloat(QUERY.get("t") || "0"), playing = !QUERY.has("t"), last = null;
  addEventListener("keydown", e => {
    if (e.key === " ") playing = !playing;
    if (e.key === "ArrowRight") t = Math.min(DURATION, t + (e.shiftKey ? 0.1 : 1));
    if (e.key === "ArrowLeft") t = Math.max(0, t - (e.shiftKey ? 0.1 : 1));
  });
  bar.addEventListener("click", e => { t = DURATION * e.clientX / innerWidth; });
  document.fonts.ready.then(() => {
    const frame = now => {
      if (playing && last !== null) t = (t + (now - last) / 1000) % DURATION;
      last = now;
      window.render(t);
      bar.firstChild.style.width = (100 * t / DURATION) + "%";
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}
</script>
