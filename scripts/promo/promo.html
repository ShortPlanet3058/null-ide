<!doctype html>
<!--
  Null's promotional film. Every frame is drawn by render(t) from the time alone, so
  scripts/promo/render.sh can film it frame by frame (opening this file in a browser plays
  it, silent: Space pauses, ← → step, ?t=60 opens it at a moment, a click on the bar seeks).

  It's timed on its music (scripts/promo/score.swift cuts the track to fit): 75 BPM, a bar
  is 3.2 s, and bar 0 is the first big beat, when the editor comes in. B(k) is bar k.
  The story: one change to a small shop, from the first line to the push.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Null: promotional film</title>
<style>
@font-face { font-family: "Instrument Sans"; font-weight: 400; src: url("../../assets/fonts/instrument-sans/InstrumentSans-Regular.ttf"); }
@font-face { font-family: "Instrument Sans"; font-weight: 500; src: url("../../assets/fonts/instrument-sans/InstrumentSans-Medium.ttf"); }
@font-face { font-family: "Instrument Sans"; font-weight: 600; src: url("../../assets/fonts/instrument-sans/InstrumentSans-SemiBold.ttf"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; src: url("../../assets/fonts/instrument-sans/InstrumentSans-Bold.ttf"); }

:root { --ui: "Instrument Sans", -apple-system, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace; --amber: #f2b35b; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; overflow: hidden; }
body.player { display: grid; place-items: center; height: 100vh; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #ebe8e2; font-family: var(--ui); -webkit-font-smoothing: antialiased; transform-origin: center; }

.caret { display: inline-block; position: relative; width: 4px; background: var(--amber); border-radius: 2px; box-shadow: 0 0 22px rgba(242,179,91,.55); }

.key { min-width: 54px; height: 54px; padding: 0 16px; display: grid; place-items: center; border-radius: 11px; background: #17171c; border: 1px solid #34343c; border-bottom-width: 3px; font: 500 26px/1 var(--ui); color: #ebe8e2; }

#scrim-top, #scrim-bottom { position: absolute; left: 0; right: 0; height: 200px; }

.segments span { padding: 7px 11px; border-radius: 7px; white-space: nowrap; }

.code { position: absolute; left: 351px; right: 0; top: 51px; overflow: hidden; font: 400 18px/33px var(--mono); }

.r .val { color: var(--faint); font-family: var(--ui); font-size: 16px; margin-left: 28px; }
.hint { position: absolute; left: 100px; display: flex; gap: 8px; align-items: center; font: 400 15px/1 var(--ui); color: var(--muted); }
.hint .k { border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 7px; font-size: 13px; color: var(--fg); margin-left: 10px; }
.hint .k:first-child { margin-left: 0; }
.prompt { position: absolute; left: 100px; width: 780px; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 9px; background: var(--raised); border: 1px solid var(--caret-half); font: 400 18px/1 var(--ui); }
.prompt .star { color: var(--caret); }
.prompt .grow { flex: 1; color: var(--fg); }
.prompt .ph { color: var(--faint); }
.prompt .hintr { color: var(--muted); font-size: 15px; }
.k-kw { color: var(--kw); } .k-ty { color: var(--ty); } .k-fn { color: var(--fn); } .k-st { color: var(--st); }
.k-nu { color: var(--nu); } .k-co { color: var(--co); } .k-pu { color: var(--pu); } .k-at { color: var(--at); } .k-ma { color: var(--fn); }
.codecaret { position: absolute; width: 2px; height: 25px; background: var(--caret); }
.term { position: absolute; left: 351px; right: 0; bottom: 37px; border-top: 1px solid var(--line); background: var(--bg); overflow: hidden; }
.term .h { position: absolute; left: 20px; top: 14px; font-size: 16px; display: flex; gap: 10px; }

.term .out { position: absolute; left: 18px; right: 18px; font: 400 17px/27px var(--mono); white-space: pre; }
.g { color: #86d6a2; } .red { color: #e88d8d; } .b { font-weight: 500; }
.tcaret { display: inline-block; width: 10px; height: 20px; background: var(--caret); vertical-align: -4px; }
.palette { position: absolute; left: 330px; width: 860px; top: 70px; border-radius: 16px; background: var(--raised); border: 1px solid var(--line-2); box-shadow: 0 30px 90px rgba(0,0,0,.55); overflow: hidden; }
.palette .q { height: 72px; display: flex; align-items: center; padding: 0 30px; font: 400 25px/1 var(--ui); border-bottom: 1px solid var(--line); position: relative; }
.palette .q .ph { color: var(--faint); }
.palette .q .r2 { position: absolute; right: 30px; font-size: 17px; color: var(--muted); }
.palette .item { height: 54px; margin: 6px 9px; padding: 0 22px; display: flex; align-items: center; gap: 14px; border-radius: 10px; font-size: 19px; }
.palette .item.on { background: var(--sel-row); }
.palette .m { color: var(--caret); }
.palette .w { margin-left: auto; color: var(--muted); font-size: 16px; }
.palette .tog { margin-left: auto; width: 42px; height: 24px; border-radius: 12px; background: var(--line-2); position: relative; }
.palette .tog.on { background: var(--caret); }
.palette .tog::after { content: ""; position: absolute; top: 3px; left: var(--knob, 3px); width: 18px; height: 18px; border-radius: 50%; background: var(--fg); }
.notice { position: absolute; right: 24px; bottom: 54px; padding: 12px 18px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-2); font-size: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }

/* ---------- providers ---------- */
#providers { position: absolute; left: 0; right: 0; top: 760px; text-align: center; }
#providers .lead { font: 400 28px/1.3 var(--ui); color: #b9b7bf; margin-bottom: 22px; }
#providers .names { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 14px; max-width: 1500px; margin: 0 auto; }
#providers .p { padding: 10px 18px; border-radius: 12px; border: 1px solid #2c2c33; background: #0d0d10; font: 500 22px/1 var(--ui); color: #ebe8e2; }

/* ---------- montage ---------- */
#montage .shot { position: absolute; left: 260px; top: 52px; width: 1400px; height: 875px; border-radius: 14px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.09); background: #000; }

#montage .osbar { position: absolute; left: 0; right: 0; top: 0; height: 46px; background: #000; border-bottom: 1px solid #1d1d22; }
#montage .osbar .ftab { position: absolute; left: 12px; top: 7px; height: 32px; background: #141418; color: #ebe8e2; }

/* ---------- the end ---------- */
#endmark { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; align-items: center; gap: 34px; font: 600 190px/1 var(--ui); letter-spacing: -0.03em; }
#endmark .caret { width: 9px; height: 170px; border-radius: 4px; }
#tagline { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font: 400 48px/1.2 var(--ui); color: #b9b7bf; }

/* ---------- vertical (9:16): the same scenes, framed for a phone ---------- */
.vertical #stage { width: 1080px; height: 1920px; }
.vertical #opening, .vertical #silence, .vertical #end { top: 420px; height: 1080px; bottom: auto; }
.vertical #back { font-size: 76px; line-height: 1.15; padding: 0 80px; top: 430px; }
.vertical #endcaret { left: 538px; }
.vertical #noise { inset: auto; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: translateX(-1166.7px) scale(1.7778); }
.vertical #caption { top: 230px; font-size: 68px; padding: 0 60px; }
.vertical #caption .sub { font-size: 34px; }
.vertical #keys { top: 1640px; }
.vertical .key { min-width: 76px; height: 76px; font-size: 36px; border-radius: 14px; }
.vertical .key-alt { font-size: 28px; }
.vertical #scrim-top, .vertical #scrim-bottom { height: 460px; }
.vertical #providers { top: 1450px; }
.vertical #providers .names { max-width: 1000px; }
.vertical #montage .label { top: 1530px; padding: 0 60px; }
.vertical #montage .label b { font-size: 60px; }
.vertical #montage .label span { font-size: 32px; }

#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: #111; cursor: pointer; }

<body>
<div id="stage">
  <div class="layer" id="opening">
    <div id="word"><span id="wordtext"></span><span class="caret" id="wordcaret"></span></div>
    <div id="definition"><i>adj.</i>amounting to nothing.</div>
  </div>
  <div class="layer" id="noise"></div>
  <div class="layer" id="silence"><div id="back"><span id="backtext"></span><span class="caret" id="backcaret"></span></div></div>
  <div class="layer" id="story">
    <div id="window"></div>
    <div id="providers"></div>
    <div id="scrim-top"></div><div id="scrim-bottom"></div>
  </div>
  <div class="layer" id="montage"></div>
  <div class="layer" id="end">
    <span class="caret" id="endcaret"></span>
    <div id="endmark"><span class="caret"></span><span>Null</span></div>
    <div id="tagline">A calm, fast code editor.</div>
    <div id="cta"><span>Free to download</span></div>
    <div id="facts">macOS&nbsp;&nbsp;·&nbsp;&nbsp;Windows&nbsp;&nbsp;·&nbsp;&nbsp;Linux&nbsp;&nbsp;·&nbsp;&nbsp;open source</div>
    <div id="url">shortplanet3058.github.io/null-ide</div>
  </div>
  <div class="layer" id="words" style="visibility:visible"><div id="caption"></div><div id="keys"></div></div>
</div>
<script>
"use strict";

// ---------- which film: the full one, or a cut (?cut=30), wide or vertical (?vertical) ----------
const QUERY = new URLSearchParams(location.search);
const CUT = QUERY.get("cut");
const VERTICAL = QUERY.has("vertical");
if (VERTICAL) document.documentElement.classList.add("vertical");

// ---------- the music's clock ----------
const BAR = 3.2, BEAT = 0.8;
const B = k => 33.66 + BAR * k;       // bar k; bar 0 is the first big beat
window.DURATION = 105.2;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const out3 = x => 1 - Math.pow(1 - x, 3);
const inOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const in3 = x => x * x * x;
const fade = (t, a, b, c, d) => Math.min(out3(prog(t, a, b)), 1 - in3(prog(t, c, d)));
const blink = (t, since = -1, still = 0.5) => (t - since < still ? 1 : ((t - since - still) % 1.06) < 0.53 ? 1 : 0);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function show(id, o, transform) {
  const el = $(id);
  el.style.opacity = o;
  el.style.visibility = o > 0.001 ? "visible" : "hidden";
  if (transform !== undefined) el.style.transform = transform;
  return o > 0.001;
}
function setHTML(id, html) { const el = $(id); if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; } }

// Sounds the film asks for (score.swift makes and mixes them): [time, kind, loudness].
window.SOUNDS = [];
const sound = (t, kind, gain = 1) => window.SOUNDS.push([+t.toFixed(3), kind, gain]);

function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
/** A person typing `text` from `start`: each character its own (repeatable) moment, a key sound each. */
function typing(text, start, perChar, seed = 7, gain = 0.8) {
  const r = seeded(seed), at = [];
  let time = start;
  for (const ch of text) {
    time += perChar * (0.55 + r() * 0.9) + (ch === " " ? perChar * 0.4 : 0) + (ch === "\n" ? perChar * 3 : 0);
    at.push(time);
    if (gain > 0) sound(time, ch === "\n" ? "enter" : "key", gain * (0.75 + r() * 0.5));
  }
  return {
    text, at, start, end: time,
    shown(t) { let n = 0; while (n < at.length && at[n] <= t) n++; return text.slice(0, n); },
    last(t) { let l = start; for (const a of at) if (a <= t) l = a; return l; },
  };
}

// ---------- Rust colours ----------
const KW = new Set("pub fn let const struct impl match if else self Self use mut as return for in where enum crate mod async await".split(" "));
function colour(src) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|(#\[[^\]]*\])|(\b\d[\d_]*\b)|(\b[a-z_][a-z0-9_]*!)|(\b[A-Za-z_][A-Za-z0-9_]*\b)(?=\s*\()|(\b[A-Za-z_][A-Za-z0-9_]*\b)|([^\sA-Za-z0-9_])/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const [w] = m;
    let cls;
    if (m[1]) cls = "co"; else if (m[2]) cls = "st"; else if (m[3]) cls = "at"; else if (m[4]) cls = "nu"; else if (m[5]) cls = "ma";
    else if (m[6]) cls = KW.has(w) ? "kw" : /^[A-Z]/.test(w) ? "ty" : "fn";
    else if (m[7]) cls = KW.has(w) ? "kw" : /^[A-Z]/.test(w) || /^(u8|u32|u64|str|bool)$/.test(w) ? "ty" : null;
    else cls = "pu";
    out += cls ? `<span class="k-${cls}">${esc(w)}</span>` : esc(w);
    last = m.index + w.length;
  }
  return out + esc(src.slice(last));
}

  if (s.notice) h += `<div class="notice" style="opacity:${s.notice[1]}">${s.notice[0]}</div>`;
  if (s.dim) h += `<div style="position:absolute;inset:0;background:#000;opacity:${s.dim.toFixed(3)}"></div>`;
  return h + (s.overlay || "");
}

// ---------- the story, scene by scene ----------
function storyState(t) {
  const s = { tabs: [["cart.rs", true]], active: "cart", bars: 1, rows: [], scroll: 5, caretCol: 4, caretBlink: 1, sidebar: "files", status: { crumbs: "src/cart.rs › Cart" } };
  // The bars fade while typing, and come back after: plainly, so it's seen.
  const fadeFor = (a, b) => (t < a ? 1 : t < b ? 1 - 0.85 * out3(prog(t, a, a + 0.5)) : 0.15 + 0.85 * out3(prog(t, b, b + 0.6)));
  if (t < B(2)) {
    // Writing `subtotal`.
    s.bars = fadeFor(T.code.start + 0.1, T.code.end + 0.6);
    const typed = T.code.shown(t), pieces = typed.split("\n");
    const lines = CART.concat(pieces);
    s.rows = lines.concat(SHIPPING_FN).map((text, i) => ({ text, n: i + 1 }));
    s.rows[lines.length - 1].caret = true;
    s.caretCol = pieces[pieces.length - 1].length || 4;
    s.caretBlink = blink(t, T.code.last(t), 0.5);
    if (typed.length > 60) s.status.crumbs = "src/cart.rs › subtotal";
  } else if (t < B(4)) {
    // ⌘P, "tests", the test file.
    const opened = t > B(2) + 1.45;
    const p = fade(t, B(2) + 0.02, B(2) + 0.18, B(2) + 1.45, B(2) + 1.6);
    s.rows = (opened ? TEST : CART_DONE).map((text, i) => ({ text, n: i + 1 }));
    s.scroll = opened ? 0 : 5;
    if (opened) { s.tabs = [["cart.rs", false], ["cart.rs  tests", true]]; s.active = "test"; s.rows[13].caret = true; s.status.crumbs = "tests/cart.rs › free_shipping_above_50"; }
    else s.rows[CART.length + 3].caret = true;
    s.caretBlink = blink(t, B(2) + 1.5, 0.5);
    if (p > 0) {
      const q = T.query.shown(t);
      const hits = q.length >= 2
        ? [["<span class='m'>tests</span>/cart.rs", "tests"], ["src/cart.rs", "src"], ["README.md", ""]]
        : [["cart.rs", "src"], ["lib.rs", "src"], ["price.rs", "src"], ["cart.rs", "tests"], ["README.md", ""]];
      s.overlay = `<div class="palette" style="opacity:${p};transform:translateY(${(1 - p) * -10}px)"><div class="q"><span style="display:inline-block;width:2px;height:28px;background:var(--caret);margin-right:2px;opacity:${blink(t, T.query.last(t), 0.4)}"></span>${q ? esc(q) : '<span class="ph">Go to file, @ for a symbol</span>'}<span class="r2">↵ open</span></div>
        ${hits.map((h, i) => `<div class="item ${i === 0 ? "on" : ""}"><span>${h[0]}</span><span class="w">${h[1]}</span></div>`).join("")}<div style="height:6px"></div></div>`;
    }
  } else if (t < B(8)) {
    // The terminal: cargo test, one fails; then back to the code.
    const back = t > B(6) + 0.8;
    s.tabs = back ? [["cart.rs", true], ["cart.rs  tests", false]] : [["cart.rs", false], ["cart.rs  tests", true]];
    s.active = back ? "cart" : "test";
    s.rows = (back ? CART_DONE : TEST).map((text, i) => ({ text, n: i + 1 }));
    s.scroll = back ? SHIP_LINE - 6 : 0;
    if (back) { s.rows[SHIP_LINE + 1].caret = true; s.caretCol = 8; s.status.crumbs = "src/cart.rs › shipping"; }
    else { s.rows[13].caret = true; s.caretCol = 4; s.status.crumbs = "tests/cart.rs › free_shipping_above_50"; }
    s.caretOn = back;
    s.caretBlink = blink(t, B(6) + 0.8, 0.5);
    const open = out3(prog(t, B(4) + 0.02, B(4) + 0.3));
    const cmd = T.cmd.shown(t), ran = t > T.cmd.end + 0.22;
    const lines = [`shop % ${cmd}${ran ? "" : `<span class="tcaret" style="opacity:${blink(t, T.cmd.last(t), 0.4)}"></span>`}`];
    if (ran) {
      const n = Math.floor(prog(t, T.cmd.end + 0.4, B(5) + 0.9) * RUN1.length + 0.0001);
      lines.push(...RUN1.slice(0, n));
      if (n >= RUN1.length) lines.push(`shop % <span class="tcaret" style="opacity:${blink(t, B(5) + 1.0, 0.4)}"></span>`);
    }
    s.term = { h: 330 * open, lines };
  } else if (t < B(13)) {
    // The turn, then AI: ⌘I, the change, ⇥, the tests again.
    const aiAt = B(11), kept = inOut(prog(t, B(12), B(12) + 0.45));
    const open = out3(prog(t, aiAt, aiAt + 0.45));
    const promptO = fade(t, B(10) + 0.05, B(10) + 0.3, aiAt - 0.25, aiAt);
    let n = 1;
    CART_DONE.forEach((text, i) => {
      if (i === SHIP_LINE + 1 && open > 0) {
        s.rows.push({ text, cls: "del", h: open * (1 - kept), alpha: 1 - kept });
        FIXED.forEach((a, j) => s.rows.push({ text: a, cls: kept > 0.5 ? "" : "add", h: open, n: n++, fadeBg: 1 - kept, caret: j === 0 }));
        s.rows.push({ hint: true, h: open * (1 - kept) * 1.3 });
        return;
      }
      s.rows.push({ text, n: n++, caret: i === SHIP_LINE + 1 && open === 0 });
      if (i === SHIP_LINE && promptO > 0) {
        const ask = T.ask.shown(t), thinking = t > T.ask.end + 0.3;
        const inner = thinking
          ? `<span class="star" style="opacity:${0.45 + 0.55 * Math.abs(Math.sin(t * 5))}">✦</span><span class="grow" style="color:var(--muted)">Thinking…</span>`
          : `<span class="star">✦</span><span class="grow">${ask ? esc(ask) + `<span style="display:inline-block;width:2px;height:20px;background:var(--caret);vertical-align:-4px;margin-left:2px;opacity:${blink(t, T.ask.last(t), 0.4)}"></span>` : '<span class="ph">Describe a change, or ask a question</span>'}</span><span class="hintr">${ask ? "↵ change" : ""}</span>`;
        s.rows.push({ prompt: inner, h: promptO * 1.6, o: promptO });
      }
    });
    s.scroll = SHIP_LINE - 6;
    s.caretCol = 8;
    s.caretOn = promptO < 0.5;
    s.caretBlink = blink(t, aiAt, 0.6);
    s.status.crumbs = "src/cart.rs › shipping";
    s.status.ai = t > B(9) ? out3(prog(t, B(9), B(9) + 0.4)) : 0;
    s.bars = t > B(10) && t < B(12) + 0.4 ? fadeFor(B(10) + 0.2, B(12) + 0.4) : 1;
    s.dim = fade(t, B(8) + 0.2, B(8) + 1.4, B(10) - 0.3, B(10) + 0.1) * 0.6;
    // ⌘K: the AI switch, in the quiet.
    const k = fade(t, B(8) + 1.65, B(8) + 1.85, B(10) - 0.35, B(10) - 0.05);
    if (k > 0) {
      const on = t > B(9), knob = 3 + 18 * out3(prog(t, B(9), B(9) + 0.18));
      const row = (label, right, sel) => `<div class="item ${sel ? "on" : ""}">${label}${right}</div>`;
      s.overlay = `<div class="palette" style="opacity:${k};transform:translateY(${(1 - k) * -10}px)"><div class="q"><span style="display:inline-block;width:2px;height:28px;background:var(--caret);margin-right:2px"></span><span>ai</span><span class="r2">↵ switch</span></div>
        ${row("AI", `<span class="tog ${on ? "on" : ""}" style="--knob:${knob}px"></span>`, true)}${row("Suggestions while typing", '<span class="tog on" style="--knob:21px"></span>')}${row("AI Settings…", "")}<div style="height:6px"></div></div>`;
    }
    if (t > B(12) + 1.0) {
      const open2 = out3(prog(t, B(12) + 1.0, B(12) + 1.3));
      const n2 = Math.floor(prog(t, B(12) + 1.5, B(12) + 2.6) * RUN2.length + 0.0001);
      const lines = ["shop % cargo test", ...RUN2.slice(0, n2)];
      if (n2 >= RUN2.length) lines.push(`shop % <span class="tcaret"></span>`);
      s.term = { h: 300 * open2, lines };
    }
  } else {
    // Commit, with a message drafted for you; push.
    s.rows = CART_DONE.slice(0, SHIP_LINE + 1).concat(FIXED, CART_DONE.slice(SHIP_LINE + 2)).map((text, i) => ({ text, n: i + 1 }));
    s.scroll = SHIP_LINE - 6;
    s.rows[SHIP_LINE + 1].caret = true;
    s.caretCol = 8;
    s.sidebar = "git";
    const draft = T.draft.shown(t).split("\n");
    const committed = t > B(14) + 0.1;
    s.git = {
      message: committed ? "" : draft[0] ? esc(draft[0]) + (draft[1] !== undefined ? `<br><span style="color:var(--muted);font-size:15px">${esc(draft[1])}</span>` : "") : "",
      drafting: t > B(13) + 0.6 && t < T.draft.end,
      go: t > B(14) - 0.15 && !committed,
      files: committed ? 0 : 1,
      ahead: committed && t < B(14) + 1.7,
    };
    s.status.crumbs = "src/cart.rs › shipping";
    s.status.ai = 1;
    if (committed) s.notice = [t > B(14) + 1.7 ? "Pushed to origin/main." : "Committed 4e1a9c2: Free shipping above 50 €.", fade(t, B(14) + 0.1, B(14) + 0.3, B(15) - 0.4, B(15))];
  }
  return s;
}

/** The camera on the window: [from, to, zoom, x, y] (where it looks, in window coordinates). */
const SHOTS = [
  [B(0), B(0) + 1.4, 1.0, 760, 420], [B(0) + 1.4, B(1) + 1.2, 1.28, 700, 620],
  [B(2) - 0.4, B(2), 1.0, 760, 420],
  [B(4), B(4) + 0.8, 1.12, 760, 700],
  [B(6) + 0.6, B(7), 1.22, 720, 420],
  [B(8) + 1.2, B(8) + 1.7, 1.0, 760, 420],
  [B(10), B(10) + 0.9, 1.25, 760, 420],
  [B(12) + 0.8, B(12) + 1.4, 1.1, 760, 640],
  [B(13) - 0.1, B(13) + 0.6, 1.3, 330, 330],
  [B(14) + 0.9, B(15) - 0.2, 1.08, 760, 420],
];
function camera(t) {
  let zoom = 1, x = 760, y = 420, from = [1, 760, 420];
  for (const [a, b, z, cx, cy] of SHOTS) {
    if (t < a) break;
    const p = inOut(prog(t, a, b));
    zoom = from[0] + (z - from[0]) * p; x = from[1] + (cx - from[1]) * p; y = from[2] + (cy - from[2]) * p;
    if (t >= b) from = [z, cx, cy];
  }
  return [zoom, x, y];
}

function renderStory(t) {
  const o = fade(t, B(0) - 0.05, B(0) + 0.3, B(15) - 0.25, B(15));
  if (!show("story", o, `scale(${0.96 + 0.04 * out3(prog(t, B(0) - 0.05, B(0) + 0.5))})`)) return;
  const w = $("window");
  const html = windowHTML(storyState(t));
  if (w.dataset.h !== html) { w.innerHTML = html; w.dataset.h = html; }
  const [zoom, x, y] = camera(t);
  if (VERTICAL) {
    // The code fills the width (its text runs from x 451 to about 1165): centred on it,
    // as close as still shows whole lines.
    const fx = x < 500 ? x : 808, fy = y;
    w.style.left = `${540 - fx}px`;
    w.style.top = `${1000 - fy}px`;
    w.style.transformOrigin = `${fx}px ${fy}px`;
    w.style.transform = `scale(${Math.min(zoom * 1.3, 1.42)})`;
  } else {
    w.style.transformOrigin = `${x}px ${y}px`;
    w.style.transform = `scale(${zoom})`;
  }
  const scrim = VERTICAL ? 1 : clamp((zoom - 1) / 0.15);
  $("scrim-top").style.opacity = scrim;
  $("scrim-bottom").style.opacity = scrim;
  // The turn: the code dims (inside the window, under the palette), the names come up.
  if (show("providers", fade(t, B(9) + 0.3, B(9) + 0.7, B(10) - 0.3, B(10)))) {
    const list = [["Claude Code", "your Claude plan"], ["Codex", "your ChatGPT plan"], ["Claude API"], ["OpenAI"], ["Gemini"], ["Mistral"], ["Groq"], ["OpenRouter"], ["NVIDIA"], ["Ollama", "on your computer"]];
    setHTML("providers", `<div class="lead">With your plan, an API key, or a model on your own computer:</div><div class="names">${list.map(([n, w2], i) =>
      `<span class="p" style="opacity:${out3(prog(t, B(9) + 0.5 + i * 0.1, B(9) + 0.8 + i * 0.1)).toFixed(2)}">${n}${w2 ? `<i>${w2}</i>` : ""}</span>`).join("")}</div>`);
  }
}

function renderMontage(t) {

// ---------- opening, noise, silence, the end ----------
function renderOpening(t) {
  if (!show("opening", fade(t, 0, 0.01, W1 - 0.5, W1))) return;
  const typed = T.word.shown(t);
  $("wordtext").textContent = typed;
  $("wordcaret").style.opacity = t < 0.25 ? 0 : blink(t, T.word.last(t), 0.45);
  $("wordcaret").style.marginLeft = typed ? "12px" : "0";
  show("definition", fade(t, 1.8, 2.5, W1 - 0.6, W1 - 0.1), `translateY(${(1 - out3(prog(t, 1.8, 2.5))) * 16}px)`);
}

function renderNoise(t) {
  if (!show("noise", t > W1 - 0.05 && t < STOP + 0.1 ? 1 : 0)) return;
  const shake = in3(prog(t, BUILD, STOP - 0.45));
  NOISE.forEach(([l, tp, w, h, , appears, , from], i) => {
    const inP = out3(prog(t, appears, appears + 0.3));
    const q = in3(prog(t, STOP - 0.42 + (i % 5) * 0.01, STOP - 0.02));
    const cx = l + w / 2, cy = tp + h / 2, slide = 1 - inP;
    const sx = from === "right" ? 260 * slide : from === "left" ? -260 * slide : 0, sy = from === "up" ? 120 * slide : 10 * slide;
    const jx = Math.sin(t * 37 + i * 1.7) * 7 * shake, jy = Math.cos(t * 41 + i * 2.3) * 5 * shake;
    const beat = t > BUILD ? Math.exp(-((t - BUILD) % BEAT) * 9) * shake * 0.03 : 0;
    const el = $("n" + i);
    el.style.opacity = inP * (1 - q);
    el.style.transform = `translate(${sx + jx + (960 - cx) * q}px, ${sy + jy + (540 - cy) * q}px) scale(${(0.96 + 0.04 * inP + beat) * (1 - 0.98 * q)})`;
  });
  for (const [id, a, b] of COUNTERS) {
    const v = Math.round(a + (b - a) * in3(prog(t, W2, STOP - 0.5)));
    $(id).textContent = id === "nb3" ? v : v > 999 ? "999+" : v;
  }
  $("spin1").style.transform = `rotate(${t * 540}deg)`;
}

function renderSilence(t) {
  if (!show("silence", fade(t, STOP - 0.05, STOP + 0.05, B(0) - 0.7, B(0) - 0.15))) return;
  const typed = T.back.shown(t);
  $("backtext").textContent = typed;
  $("backcaret").style.marginLeft = typed ? "8px" : "0";
  $("backcaret").style.opacity = blink(t, Math.max(T.back.last(t), STOP), 0.4);
}

function renderEnd(t) {

function renderWords(t) {
  let cap = "", capO = 0, capY = 0;
  for (const [a, b, text] of CAPTIONS) {
    const f = fade(t, a, a + 0.4, b - 0.3, b);
    if (f > 0) { cap = text; capO = f; capY = (1 - out3(prog(t, a, a + 0.45))) * 14; }
  }
  setHTML("caption", cap);
  show("caption", capO, `translateY(${capY}px)`);
  let html = "", o = 0, scale = 1;
  for (const [a, b, keys, alt] of KEYS) {
    const f = fade(t, a, a + 0.1, b - 0.2, b);
    if (f > 0) {
      html = `<div class="pill">${keys.map(k => `<span class="key">${k}</span>`).join("")}${alt ? `<span class="key-alt">${alt}</span>` : ""}</div>`;
      o = f; scale = 1 - 0.07 * Math.sin(Math.PI * prog(t, a + 0.1, a + 0.28));
    }
  }
  setHTML("keys", html);
  show("keys", o, `scale(${scale})`);
}

// ---------- the 30-second cut: the full film's moments, re-timed on the music's bars ----------
// [cut from, cut to, film from, film to]: each piece of the cut shows that stretch of the
// full film (faster or slower to fit). The music: score.swift --pieces (see render.sh).
const KEEP = [0, 1, 2, 4, 6, 7, 8, 9];   // montage shots kept: task, debug, md, vim, themes, windows, linux, mac
const EDITS = {
  "30": [
    [0, 4.22, W1, STOP - 0.42],              // the noise, fast: chaos from the first frame
    [4.22, 4.64, STOP - 0.42, STOP],         // pulled into the caret as the music stops
    [4.64, 7.40, STOP, B(0)],                // the silence, and the sentence
    [7.40, 10.60, B(0), B(2) - 0.15],        // the first big beat: writing, the bars fading
    [10.60, 13.80, B(10) + 0.1, B(11)],      // ⌘I, in plain words
    [13.80, 15.40, B(11), B(12)],            // the change, shown
    [15.40, 17.00, B(12), B(12) + 1.0],      // ⇥: kept
    ...KEEP.map((k, j) => [17.0 + 0.8 * j, 17.8 + 0.8 * j, B(15) + k * BAR / 2, B(15) + (k + 1) * BAR / 2]),
    [23.40, 30.20, B(20), 105.2],            // the end card, on the music's last phrase
  ],
};
const EDIT = CUT ? EDITS[CUT] : null;
const FULL_DURATION = window.DURATION;
if (EDIT) window.DURATION = EDIT[EDIT.length - 1][1];
/** The full film's sounds, where the cut shows them (once every sound is known). */
function cutSounds() {
  if (!EDIT) return;
  const kept = [];
  for (const [t, kind, gain] of window.SOUNDS) {
    for (const [a, b, fa, fb] of EDIT) {
      if (t >= fa && t < fb) { kept.push([+(a + (t - fa) * (b - a) / (fb - fa)).toFixed(3), kind, gain]); break; }
    }
  }
  window.SOUNDS = kept;
}
function filmTime(t) {
  if (!EDIT) return t;
  for (const [a, b, fa, fb] of EDIT) if (t < b) return fa + (clamp(t, a, b) - a) * (fb - fa) / (b - a);
  return FULL_DURATION;
}

let measured = false;
window.render = function (cutTime) {
  const t = filmTime(cutTime);
  if (!measured) {
    const c = document.createElement("canvas").getContext("2d");
    c.font = "400 18px 'Geist Mono'";
    charW = c.measureText("0000000000").width / 10;
    measured = true;
  }
  renderOpening(t);
  renderNoise(t);
  renderSilence(t);
  renderStory(t);
  renderMontage(t);
  renderEnd(t);
  renderWords(t);
};

buildNoise();
buildMontage();
cutSounds();
applyTheme($("window"));
// The app's pictures, drawn once into canvases (a large image shown for the first time can
// be painted a frame late; a canvas is always there). The film is ready once they are.
window.ready = Promise.all([...document.querySelectorAll("canvas[data-src]")].map(canvas => {
  const img = new Image();
  img.src = canvas.dataset.src;
  return img.decode().then(() => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext("2d").drawImage(img, 0, 0);
  }).catch(() => {});
}));
window.SOUNDS.sort((a, b) => a[0] - b[0]);

// ---------- playing it in a browser ----------
if (!navigator.userAgent.includes("NullFilm")) {
  document.body.classList.add("player");
  const bar = document.createElement("div");
  bar.id = "bar"; bar.innerHTML = "<div></div>";
  document.body.appendChild(bar);
  const fit = () => {
    const [W, H] = VERTICAL ? [1080, 1920] : [1920, 1080];
    const sc = Math.min(innerWidth / W, (innerHeight - 8) / H);
    $("stage").style.transform = `scale(${sc})`;
    $("stage").style.margin = `${(H * sc - H) / 2}px ${(W * sc - W) / 2}px`;
  };
  addEventListener("resize", fit); fit();
  let t = parseFloat(QUERY.get("t") || "0"), playing = !QUERY.has("t"), last = null;
  addEventListener("keydown", e => {
    if (e.key === " ") playing = !playing;
    if (e.key === "ArrowRight") t = Math.min(DURATION, t + (e.shiftKey ? 0.1 : 1));
    if (e.key === "ArrowLeft") t = Math.max(0, t - (e.shiftKey ? 0.1 : 1));
  });
  bar.addEventListener("click", e => { t = DURATION * e.clientX / innerWidth; });
  document.fonts.ready.then(() => {
    const frame = now => {
      if (playing && last !== null) t = (t + (now - last) / 1000) % DURATION;
      last = now;
      window.render(t);
      bar.firstChild.style.width = (100 * t / DURATION) + "%";
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}
</script>
